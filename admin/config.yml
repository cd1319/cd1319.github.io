# Netlify CMS 配置文件

# 后端配置：使用Netlify Identity + Git Gateway
backend:
  name: git-gateway
  branch: main

# 本地开发时启用（可选，但建议加上）
local_backend: true

# 媒体文件（如图片）的存储位置
media_folder: "images/uploads"
public_folder: "/images/uploads"

# 文章集合配置
collections:
  - name: "blog"
    label: "博客文章"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      # 👇 修改日期字段，添加时区配置
      - {label: "发布日期", name: "date", widget: "datetime", 
         format: "YYYY-MM-DD HH:mm:ss",    # 存储格式
         date_format: "YYYY-MM-DD",        # 日期选择器显示格式
         time_format: "HH:mm:ss",          # 时间选择器显示格式
         picker_utc: false}                 # 👈 关键：使用本地时区（东八区）
      - {label: "正文内容", name: "body", widget: "simplemde"}
