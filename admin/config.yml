# Netlify CMS 配置文件

# 后端配置：使用Netlify Identity + Git Gateway
backend:
  name: git-gateway                # 改为git-gateway，而不是github
  branch: main                      # 你的主分支名称（main或master）

# 本地开发时启用（可选，但建议加上）
local_backend: true

# 媒体文件（如图片）的存储位置
media_folder: "images/uploads"     # 上传的图片会保存在仓库的 images/uploads 文件夹
public_folder: "/images/uploads"   # 图片在网站中的访问路径

# 文章集合配置
collections:
  - name: "blog"
    label: "博客文章"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss"}
      - {label: "正文内容", name: "body", widget: "simplemde"}  # 👈 原来是 "markdown"，改成 "simplemde"
