<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- 光标修复样式（作为补充） -->
  <style>
    [data-slate-editor] {
      -webkit-user-modify: read-write !important;
      -moz-user-modify: read-write !important;
      user-modify: read-write !important;
    }
  </style>
  <title>博客内容管理</title>
</head>
<body>
  <!-- 1. 先加载 Netlify CMS -->
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  
  <!-- 2. 再加载 SimpleMDE 插件（解决中文输入问题） -->
  <script src="https://cdn.jsdelivr.net/npm/netlify-cms-widget-simplemde/dist/main.min.js"></script>
  
  <!-- 3. 注册 SimpleMDE 小部件 -->
  <script>
    // 确保 CMS 加载完成后再注册
    if (typeof CMS !== 'undefined') {
      CMS.registerWidget('simplemde', SimpleMDEControl, SimpleMDEPreview);
      console.log('SimpleMDE 编辑器已注册，现在可以用中文输入啦！');
    }
  </script>

  <!-- 4. 原有的 Identity 处理脚本 -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', user => {
        if (!user) {
          window.netlifyIdentity.on('login', () => {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
